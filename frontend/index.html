<script id="pg-boot-auth-gate">
(function () {
  const CFG = {
    badge: "NEET",
    title: "GOALisB NEET UG Master",
    tag: "NEET UG MEDICAL",
    sub: "Physics (45 Qs &bull; 180m) &bull; Chemistry (45 Qs &bull; 180m) &bull; Biology: Botany &amp; Zoology (90 Qs &bull; 360m) &bull; 720 Marks Scale",
    marking: "All 180 Compulsory MCQs: +4 Correct | -1 Incorrect",
    pattern: "180 Qs | 180 Mins (3 Hrs) | NTA OMR / CBT Scale",
    modes: [
      {
        "id": "NEET_FULL",
        "label": "NEET UG Full 180-Q (720 Marks)",
        "sub": "(NTA Standard)",
        "sections": "Physics (45 Qs) &bull; Chemistry (45 Qs) &bull; Botany (45 Qs) &bull; Zoology (45 Qs)",
        "pattern": "180 Compulsory MCQs | 180 Mins | High-Speed Accuracy Scale",
        "marking": "+4 Correct | -1 Incorrect | 0 Unattempted",
        "targetTab": 1
      },
      {
        "id": "NEET_BIO",
        "label": "NCERT Line-by-Line Biology Vault",
        "sub": "(360 Marks Core)",
        "sections": "Class 11 & 12 Botany + Zoology Verbatim NCERT Statements, Diagrams & Cycles",
        "pattern": "Sub-35s Biology Sprint Drills | Zero Silly-Slip Accuracy",
        "marking": "+4 / -1 NCERT Precision Check",
        "targetTab": 2
      },
      {
        "id": "NEET_AR",
        "label": "Assertion-Reason & Statement Clinic",
        "sub": "(Trap Clinic)",
        "sections": "Statement I & II + Assertion-Reason Drills across Biology, Organic & Inorganic",
        "pattern": "Eliminates 'Both True but Not Correct Explanation' Traps",
        "marking": "+4 Correct | -1 Incorrect",
        "targetTab": 3
      }
    ],
    tabs: [
      "1. Physics, Chem & Biology (12x12)",
      "2. NCERT Line-by-Line Bio Vault",
      "3. Assertion-Reason Studio",
      "4. 180-Q / 720-Mark NEET Mock",
      "5. Trap Doctor & AI Doubts",
      "6. NEET AIR & AIIMS/GMC Forecaster"
    ],
    defaultTel: "Target: 685/720 (AIIMS / Top GMC) &bull; Readiness: 632/720 (~AIR 4,800)"
  };

  window._ACTIVE_MODE_IDX = window._ACTIVE_MODE_IDX || 0;
  window._ACTIVE_TAB_NUM  = window._ACTIVE_TAB_NUM  || 1;

  function getUser() {
    try {
      const raw = localStorage.getItem("ipm_user_profile") || localStorage.getItem("goalisb_exam_prep_profile_v1") || localStorage.getItem("ipm_user");
      if (!raw) return null;
      const u = JSON.parse(raw);
      if (u && u.full_name && !u.name) u.name = u.full_name;
      return (u && (u.name || u.full_name)) ? u : null;
    } catch (e) { return null; }
  }

  window.handlePostgradLogout = function () {
    localStorage.removeItem("goalisb_exam_prep_profile_v1");
    localStorage.removeItem("goalisb_postgrad_profile_v1");
    localStorage.removeItem("ipm_user");
    localStorage.removeItem("ipm_token");
    window.IPM_USER = null;
    window.location.reload();
  };

              window.selectExamMode = function (idx) {
    window._ACTIVE_MODE_IDX = Number(idx);
    const m = CFG.modes[window._ACTIVE_MODE_IDX] || CFG.modes[0];
    CFG.sub = m.sections;
    CFG.pattern = m.pattern;
    CFG.marking = m.marking;
    renderCleanHeader();
    if (m.targetTab && typeof window.selectUnifiedTab === "function") {
      window.selectUnifiedTab(m.targetTab);
    }
  };
  window.selectUnifiedTab = function (tabNum) {
    const n = Number(tabNum);
    window._ACTIVE_TAB_NUM = n;
    window.ACTIVE_TAB = n; window.IPM_STATE = window.IPM_STATE || {}; window.IPM_STATE.activeTab = (n === 4 ? "tab8" : (n === 5 ? "tab4" : "tab" + n)); window.scrollTo(0, 0); const oldPgMount = document.getElementById("pgStudioLiveMount"); if (oldPgMount && n >= 3) oldPgMount.remove();
    renderCleanHeader();

    const header = document.querySelector("header");
    let el = document.getElementById("main-workspace") || document.querySelector("main") || document.getElementById("tab-content");
    if (!el && header) {
      let sib = header.nextElementSibling;
      while (sib) {
        if (sib.tagName !== "SCRIPT" && !sib.id.includes("modal") && !sib.id.includes("gate") && sib.offsetHeight > 80) {
          el = sib;
          break;
        }
        sib = sib.nextElementSibling;
      }
    }
    if (!el) return;
    el.id = "main-workspace";
    window._LAST_TAB6_EL = el;

    if (n === 1) {
      if (typeof window.renderQuantTab === "function") { el.innerHTML = ""; window.renderQuantTab(el); return; }
      if (typeof window.renderTab1 === "function") { el.innerHTML = ""; window.renderTab1(el); return; }
    } else if (n === 2) {
      el.innerHTML = ""; window.renderTab2(el);
    } else if (n === 3) {
      el.innerHTML = ""; window.renderVerbalStudio3(el);
    } else if (n === 4) {
      el.innerHTML = ""; window.renderMockSimulator4(el);
    } else if (n === 5) {
      el.innerHTML = ""; window.renderTrapClinic5(el);
    } else if (n === 6) {
      el.innerHTML = ""; window.renderTab6(el);
    }
  };

  function renderCleanHeader() {
    const header = document.querySelector("header");
    if (!header) return;

    const user = getUser();
    const name = user ? user.name : "Guest Aspirant";
    let hist = [];
    try { hist = JSON.parse(localStorage.getItem("ipm_mock_history_v1") || "[]"); } catch (e) {}
    const latest = hist[0];

    let telemetry = CFG.defaultTel;
    if (latest && latest.maxScore) {
      const host = window.location.host.toLowerCase();
      if (host.includes("gmat")) {
        const est = Math.min(805, Math.max(205, Math.round((205 + (latest.score / latest.maxScore) * 600) / 10) * 10 + 5));
        telemetry = `Mocks: ${hist.length} &bull; Latest Scaled: ${est}/805`;
      } else if (host.includes("gre")) {
        const est = Math.min(340, Math.max(260, Math.round(260 + (latest.score / latest.maxScore) * 80)));
        telemetry = `Mocks: ${hist.length} &bull; Latest Scaled: ${est}/340`;
      } else {
        const scaled198 = Math.round((latest.score / latest.maxScore) * 198);
        telemetry = `Mocks: ${hist.length} &bull; Latest Scaled: ${scaled198}/198`;
      }
    } else if (user && user.targetScore) {
      telemetry = `Target: ${user.targetScore} &bull; Mocks: 0`;
    }

    const isDark = !document.body.classList.contains("light-mode");
    const modePills = CFG.modes.map((m, idx) => {
      const active = idx === window._ACTIVE_MODE_IDX;
      return `<button type="button" onclick="window.selectExamMode(${idx});"
        class="px-3.5 py-1.5 rounded-full text-xs font-bold transition cursor-pointer ${active ? 'bg-indigo-600 text-white shadow-sm' : 'bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-200 border border-slate-300 dark:border-slate-700 hover:border-indigo-500'}">
        ${m.label} <span class="opacity-75 font-normal text-[11px]">${m.sub}</span>
      </button>`;
    }).join("");

    const tabPills = CFG.tabs.map((lbl, idx) => {
      const num = idx + 1;
      const active = num === window._ACTIVE_TAB_NUM;
      return `<button type="button" onclick="window.selectUnifiedTab(${num})"
        class="px-3.5 py-2 rounded-full text-xs font-bold transition cursor-pointer ${active ? 'bg-indigo-600 text-white shadow-sm' : 'bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-200 border border-slate-300 dark:border-slate-700 hover:border-indigo-500'}">
        ${lbl}
      </button>`;
    }).join("");

    header.innerHTML = `
      <div class="max-w-7xl mx-auto px-4 py-2 space-y-2">
        <!-- Row 1: Brand Title + Candidate Readiness Pill + Action Buttons -->
        <div class="flex flex-wrap lg:flex-nowrap items-center justify-between gap-2">
          <div class="flex items-center gap-2.5 min-w-0">
            <div class="w-10 h-10 rounded-xl bg-indigo-600 text-white font-black text-xs flex items-center justify-center shadow-md shrink-0">${CFG.badge}</div>
            <div>
              <div class="flex items-center gap-2 flex-wrap">
                <span class="font-extrabold text-base text-slate-900 dark:text-white tracking-tight whitespace-nowrap">${CFG.title}</span>
                <span class="text-[10px] font-extrabold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700 dark:bg-emerald-500/20 dark:text-emerald-300">${CFG.tag}</span>
              </div>
              <div class="text-[11px] text-slate-500 dark:text-slate-400 truncate max-w-md xl:max-w-xl">${CFG.sub}</div>
            </div>
          </div>

          <div class="flex items-center gap-1.5 flex-nowrap shrink-0">
            <button type="button" onclick="if(typeof window.openPostgradAuthGate==='function') window.openPostgradAuthGate('REGISTER');"
              title="Click to update Target Score"
              class="px-3 py-1 rounded-full bg-slate-50 whitespace-nowrap dark:bg-slate-900 border border-slate-300 dark:border-slate-700 text-xs flex items-center gap-1.5 hover:border-indigo-500 transition cursor-pointer">
              <span class="font-bold text-slate-900 dark:text-white">&#128100; ${name}</span>
              <span class="text-slate-400">|</span>
              <span class="font-semibold text-indigo-600 dark:text-indigo-300">${telemetry}</span>
            </button>

            <button type="button" onclick="if(typeof window.openUpgradeModal==='function') window.openUpgradeModal();"
              class="px-3 py-1 rounded-xl whitespace-nowrap bg-amber-400 hover:bg-amber-300 text-slate-950 text-xs font-extrabold shadow-sm cursor-pointer">
              &#11088; Go Pro Learner
            </button>

            ${user ? `
              <button type="button" onclick="window.handlePostgradLogout()"
                class="px-3 py-1 rounded-xl whitespace-nowrap bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold shadow-sm cursor-pointer">
                Exit / Logout
              </button>
            ` : `
              <button type="button" onclick="if(typeof window.openPostgradAuthGate==='function') window.openPostgradAuthGate('REGISTER');"
                class="px-3 py-1 rounded-xl whitespace-nowrap bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold shadow-sm cursor-pointer">
                Login / Register
              </button>
            `}

            <button type="button" onclick="document.body.classList.toggle('light-mode'); document.documentElement.classList.toggle('dark'); renderCleanHeader();"
              class="px-2.5 py-1 rounded-xl whitespace-nowrap border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 text-xs font-semibold text-slate-700 dark:text-slate-200 cursor-pointer">
              ${isDark ? "&#9728; Light Mode" : "&#127769; Dark Mode"}
            </button>
          </div>
        </div>

        <!-- Row 2: Exam Track Pills -->
        <div class="flex flex-wrap items-center gap-2">${modePills}</div>

        <!-- Row 3: Exam Sections & Marking Telemetry Box -->
        <div class="px-4 py-2.5 rounded-2xl bg-slate-50 dark:bg-slate-900/90 border border-slate-200 dark:border-slate-800 flex flex-wrap items-center justify-between gap-2 text-xs">
          <div><strong class="text-indigo-700 dark:text-indigo-300">Exam Sections:</strong> <span class="text-slate-700 dark:text-slate-300">${CFG.sub}</span></div>
          <div class="flex flex-wrap items-center gap-4 text-[11px]">
            <span><strong class="text-emerald-700 dark:text-emerald-400">Pattern:</strong> ${CFG.pattern}</span>
            <span><strong class="text-amber-700 dark:text-amber-400">Marking:</strong> ${CFG.marking}</span>
          </div>
        </div>

        <!-- Row 4: 6 Main Navigation Tabs -->
        <div class="flex flex-wrap items-center gap-2 pt-0.5">${tabPills}</div>
      </div>
    `;
  }

  window.renderCleanHeader = renderCleanHeader;
  window.addEventListener("DOMContentLoaded", renderCleanHeader);
  // Event-driven header rendering (zero polling CPU)
})();
</script>
